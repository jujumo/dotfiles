set-option -g default-shell /bin/zsh

# Advertise tmux's real capabilities to programs inside panes (256 colours,
# italics) instead of the built-in "screen" fallback, and tell tmux that the
# outer terminal handles 24-bit colour.
set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",*:RGB"

set-option -g prefix C-a
bind-key C-a send-prefix
set -g status on
set -g mouse on
set -g set-clipboard on

# Terminator-style split bindings (prefix is C-a)
# E = side-by-side panes, O = stacked panes
unbind '"'
unbind %
bind e split-window -h
bind o split-window -v
